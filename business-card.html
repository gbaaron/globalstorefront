<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Storefront — Business Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            gap: 3rem;
        }

        h2 {
            color: #8892a0;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        /* Standard business card: 3.5in x 2in at 300dpi = 1050x600 */
        /* Scaled for screen: using px that maintain ratio */
        .card {
            width: 700px;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
        }

        /* ===== FRONT ===== */
        .card-front {
            background: #0f0f1a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1.25rem;
        }

        .card-front .logo {
            width: 100px;
            height: 100px;
            border-radius: 16px;
        }

        .card-front .brand-name {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .card-front .brand-tagline {
            color: #8892a0;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .card-front .accent-line {
            width: 50px;
            height: 2px;
            background: #d4af37;
            border-radius: 2px;
        }

        /* ===== BACK ===== */
        .card-back {
            background: #0f0f1a;
            display: flex;
            padding: 2.5rem;
        }

        .card-back .left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-back .contact-name {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .card-back .contact-title {
            color: #d4af37;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .card-back .contact-details {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .card-back .contact-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #8892a0;
            font-size: 0.78rem;
        }

        .card-back .contact-row svg {
            width: 14px;
            height: 14px;
            color: #d4af37;
            flex-shrink: 0;
        }

        .card-back .contact-row a {
            color: #8892a0;
            text-decoration: none;
        }

        .card-back .right {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .card-back .qr {
            width: 130px;
            height: 130px;
            border-radius: 8px;
        }

        .card-back .qr-label {
            color: #4a5568;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .card-back .logo-sm {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }

        .print-note {
            color: #4a5568;
            font-size: 0.7rem;
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
        }

        @media print {
            body { background: white; padding: 0.5in; }
            .card { box-shadow: none; border: 1px solid #ddd; }
            h2 { color: #333; }
            .print-note { display: none; }
        }
    </style>
</head>
<body>
    <!-- FRONT -->
    <div class="card-wrapper">
        <h2>Front</h2>
        <div class="card card-front" id="cardFront">
            <img class="logo" id="logoImg" alt="Global Storefront Logo">
            <div class="accent-line"></div>
            <div class="brand-name">Global Storefront</div>
            <div class="brand-tagline">Custom Web Solutions</div>
        </div>
    </div>

    <!-- BACK -->
    <div class="card-wrapper">
        <h2>Back</h2>
        <div class="card card-back" id="cardBack">
            <div class="left">
                <div>
                    <div class="contact-name">Aaron Arendsen</div>
                    <div class="contact-title">Founder & Developer</div>
                </div>
                <div class="contact-details">
                    <div class="contact-row">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <span>aaron@globalmedia.com</span>
                    </div>
                    <div class="contact-row">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                        <span>globalstorefront.netlify.app</span>
                    </div>
                    <div class="contact-row">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <span>Global Media</span>
                    </div>
                </div>
            </div>
            <div class="right">
                <img class="logo-sm" id="logoSmImg" alt="Logo">
                <img class="qr" id="qrImg" alt="QR Code">
                <div class="qr-label">Scan to visit</div>
            </div>
        </div>
    </div>

    <p class="print-note">Right-click → Print or Cmd+P to save as PDF. Print at 100% scale on standard business card stock (3.5" × 2").</p>

    <script>
        // Load images from local files
        document.getElementById('logoImg').src = 'logo.png';
        document.getElementById('logoSmImg').src = 'logo.png';
        document.getElementById('qrImg').src = 'qr-code.png';
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Master &mdash; Global Storefront</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root {
    --color-bg: #0f0f1a;
    --color-bg-soft: #131322;
    --color-card: #1a1a2e;
    --color-card-hover: #20203a;
    --color-accent: #d4af37;
    --color-accent-alt: #e6c65c;
    --color-accent-glow: rgba(212, 175, 55, 0.18);
    --color-text: #ffffff;
    --color-text-muted: #8892a0;
    --color-text-label: #b9c0cc;
    --color-border: #2a2a45;
    --color-border-soft: #1f1f36;
    --color-input-bg: #0c0c16;
    --color-input-border: #2a2a45;
    --color-error-bg: rgba(239, 68, 68, 0.1);
    --color-error-text: #f87171;
    --color-success-bg: rgba(34, 197, 94, 0.1);
    --color-success-text: #4ade80;
    --color-warn-bg: rgba(245, 158, 11, 0.1);
    --color-warn-text: #fbbf24;
    --grad-brand: linear-gradient(135deg, #e6c65c 0%, #d4af37 50%, #b8962e 100%);
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
}

body::before {
    content: '';
    position: fixed;
    inset: -10%;
    background:
        radial-gradient(ellipse 900px 700px at 12% 4%, rgba(212, 175, 55, 0.13), transparent 55%),
        radial-gradient(ellipse 800px 650px at 90% 20%, rgba(70, 90, 190, 0.10), transparent 55%);
    z-index: 0;
    pointer-events: none;
    filter: blur(10px);
}

/* ---------- shell ---------- */

.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 2rem;
    background: rgba(8, 8, 13, 0.93);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--color-border-soft);
}

.topbar-brand { display: flex; align-items: center; gap: 0.75rem; font-weight: 700; font-size: 0.95rem; }
.topbar-brand span { color: var(--color-accent); }
.topbar-brand .sep { color: var(--color-text-muted); font-weight: 500; }

.logo-mark {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: var(--grad-brand);
    display: grid; place-items: center;
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.02em;
}

.topbar-right { display: flex; align-items: center; gap: 1rem; }
.viewer-chip {
    font-size: 0.75rem;
    color: var(--color-text-muted);
    padding: 0.35rem 0.7rem;
    border: 1px solid var(--color-border);
    border-radius: 999px;
}

.wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }

.page-head { margin-bottom: 2rem; }
.page-head h1 { font-size: clamp(1.7rem, 3.4vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; }
.page-head h1 em { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 400; color: var(--color-accent-alt); }
.page-head p { color: var(--color-text-muted); margin-top: 0.55rem; font-size: 0.92rem; max-width: 62ch; line-height: 1.6; }

/* ---------- picker ---------- */

.picker {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 1.75rem;
}

.picker label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--color-text-label);
    margin-bottom: 0.6rem;
}

select {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--color-text);
    background: var(--color-input-bg);
    border: 1px solid var(--color-input-border);
    border-radius: var(--radius-md);
    padding: 0.9rem 2.5rem 0.9rem 1rem;
    appearance: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8aa0' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 1rem center;
    background-size: 18px;
}
select:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-glow); }

/* ---------- build panel ---------- */

.panel {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
}

.panel-head {
    padding: 1.5rem;
    border-bottom: 1px solid var(--color-border-soft);
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
}
.panel-head h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
.panel-head .sub { color: var(--color-text-muted); font-size: 0.85rem; margin-top: 0.3rem; }

.pills { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.pill {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 0.3rem 0.6rem; border-radius: 999px;
    background: var(--color-bg-soft); color: var(--color-text-muted);
    border: 1px solid var(--color-border);
}
.pill.ok   { background: var(--color-success-bg); color: var(--color-success-text); border-color: transparent; }
.pill.warn { background: var(--color-warn-bg);    color: var(--color-warn-text);    border-color: transparent; }
.pill.bad  { background: var(--color-error-bg);   color: var(--color-error-text);   border-color: transparent; }

.panel-body { padding: 1.5rem; }

.section { margin-bottom: 1.75rem; }
.section:last-child { margin-bottom: 0; }
.section > h3 {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 700; color: var(--color-text-label); margin-bottom: 0.85rem;
}

/* ---------- buttons ---------- */

.btn {
    font-family: inherit; font-size: 0.9rem; font-weight: 600;
    border: 1px solid var(--color-border);
    background: var(--color-bg-soft);
    color: var(--color-text);
    border-radius: var(--radius-md);
    padding: 0.7rem 1.1rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 0.5rem;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
}
.btn:hover { background: var(--color-card-hover); border-color: var(--color-accent); transform: translateY(-1px); }
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }

.btn-hero {
    background: var(--grad-brand);
    border: none;
    font-size: 1rem;
    padding: 1rem 1.5rem;
    box-shadow: 0 10px 30px -12px var(--color-accent);
}
.btn-hero:hover { background: var(--grad-brand); filter: brightness(1.08); }
.btn-hero.plain { background: var(--color-bg-soft); border: 1px solid var(--color-border); box-shadow: none; }

.btn-row { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center; }

/* ---------- roles ---------- */

.roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.8rem; }

.role {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--color-bg-soft);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 1rem;
    transition: border-color 0.2s, transform 0.2s, background 0.2s;
}
.role:hover { border-color: var(--color-accent); background: var(--color-card-hover); transform: translateY(-2px); }
.role.is-ultra { border-color: rgba(212, 175, 55, 0.55); background: rgba(212, 175, 55, 0.07); }

.role-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.4rem; }
.role-label { font-weight: 700; font-size: 0.95rem; }
.role-tag {
    font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em;
    padding: 0.2rem 0.45rem; border-radius: 4px;
    background: var(--color-accent); color: #fff;
}
.role-note { font-size: 0.78rem; color: var(--color-text-muted); line-height: 1.55; }
.role-url { font-size: 0.7rem; color: var(--color-accent-alt); margin-top: 0.55rem; word-break: break-all; }

/* ---------- meta + notes ---------- */

.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
.meta-item { background: var(--color-bg-soft); border: 1px solid var(--color-border-soft); border-radius: var(--radius-sm); padding: 0.85rem 1rem; }
.meta-item dt { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--color-text-muted); font-weight: 700; margin-bottom: 0.3rem; }
.meta-item dd { font-size: 0.85rem; font-weight: 500; word-break: break-word; }
.meta-item a { color: var(--color-accent-alt); text-decoration: none; }
.meta-item a:hover { text-decoration: underline; }

.notes {
    background: var(--color-input-bg);
    border: 1px solid var(--color-border-soft);
    border-radius: var(--radius-md);
    padding: 1.1rem 1.2rem;
    font-size: 0.84rem;
    line-height: 1.65;
    color: var(--color-text-label);
    white-space: pre-wrap;
    word-break: break-word;
}

.msg { border-radius: var(--radius-md); padding: 1rem 1.15rem; font-size: 0.87rem; line-height: 1.6; }
.msg.bad  { background: var(--color-error-bg); color: var(--color-error-text); }
.msg.warn { background: var(--color-warn-bg);  color: var(--color-warn-text); }

.footnote { color: var(--color-text-muted); font-size: 0.78rem; line-height: 1.6; margin-top: 1.25rem; }

.empty { text-align: center; padding: 4rem 2rem; color: var(--color-text-muted); }

.toast {
    position: fixed; bottom: 2rem; left: 50%; transform: translate(-50%, 200%);
    background: var(--color-card); border: 1px solid var(--color-accent);
    padding: 0.8rem 1.3rem; border-radius: var(--radius-md);
    font-size: 0.87rem; font-weight: 500; z-index: 60;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.toast.show { transform: translate(-50%, 0); }

@media (max-width: 640px) {
    /* Phone width has to fit brand + who-you-are + sign out on one row, so the
       brand drops its qualifier and the email truncates rather than pushing the
       button off the screen. */
    .topbar { padding: 0.75rem 1rem; gap: 0.5rem; }
    .topbar-brand { font-size: 0.85rem; min-width: 0; }
    .topbar-brand .sep { display: none; }
    .logo-mark { width: 30px; height: 30px; border-radius: 8px; font-size: 0.65rem; }
    .topbar-right { gap: 0.5rem; min-width: 0; }
    .viewer-chip {
        font-size: 0.68rem;
        padding: 0.3rem 0.55rem;
        max-width: 38vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .topbar-right .btn { padding: 0.5rem 0.7rem; font-size: 0.8rem; white-space: nowrap; }

    .wrap { padding: 1.75rem 1rem 4rem; }
    .roles { grid-template-columns: 1fr; }
    .btn-row { gap: 0.5rem; }
    .btn-row .btn, .btn-row .btn-hero { width: 100%; justify-content: center; }
}
</style>
<script src="native-bridge.js"></script>
</head>
<body>

<header class="topbar">
    <div class="topbar-brand">
        <img src="logo-removebg-preview.png" alt="Global Storefront" width="34" height="34" style="object-fit:contain">
        <div>Global <span>Storefront</span> <span class="sep">&mdash; Master</span></div>
    </div>
    <div class="topbar-right">
        <span class="viewer-chip" id="viewerChip">&hellip;</span>
        <button class="btn" id="signOutBtn" type="button">Sign out</button>
    </div>
</header>

<div class="wrap">
    <div class="page-head">
        <h1>Every build, <em>at any level.</em></h1>
        <p>Pick a client and open their build signed in as whichever role you need. Where a build declares an ultra admin, that is the top button.</p>
    </div>

    <div class="picker">
        <label for="buildSelect">Client build</label>
        <select id="buildSelect"><option>Loading&hellip;</option></select>
    </div>

    <div id="panelHost">
        <div class="empty" id="loadingState">Loading builds&hellip;</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN_KEY = 'gsToken';

// Portal login drops the token here. No token means this page was opened directly.
const token = localStorage.getItem(TOKEN_KEY);
if (!token) {
    window.location.replace('/');
}

let CLIENTS = [];

function escapeHtml(str) {
    return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(str) { return escapeHtml(str); }

function showToast(message) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function formatDate(value) {
    if (!value) return '—';
    const d = new Date(value);
    if (isNaN(d)) return value;
    return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

const ICON_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';
const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';

function statusPill(status) {
    const cls = status === 'Active' ? 'ok' : status === 'Pending' ? 'warn' : status === 'Archived' ? 'bad' : '';
    return '<span class="pill ' + cls + '">' + escapeHtml(status || 'No status') + '</span>';
}

function renderPanel(client) {
    const b = client.build || {};
    const host = document.getElementById('panelHost');

    const head =
        '<div class="panel-head">' +
            '<div>' +
                '<h2>' + escapeHtml(client.company || client.name || 'Untitled build') + '</h2>' +
                '<div class="sub">' + escapeHtml(client.name || '') + '</div>' +
            '</div>' +
            '<div class="pills">' +
                statusPill(client.status) +
                (client.clientType ? '<span class="pill">' + escapeHtml(client.clientType) + '</span>' : '') +
                (b.reachable ? '<span class="pill ok">Build reachable</span>' : '<span class="pill">Website only</span>') +
            '</div>' +
        '</div>';

    let body = '';

    if (!b.reachable) {
        body +=
            '<div class="section">' +
                '<div class="msg">This is a website without a <strong>showcase.json</strong>, so there are no roles to switch between. ' +
                escapeHtml(b.error || '') + '</div>' +
            '</div>';
        if (client.projectUrl) {
            body +=
                '<div class="section"><h3>Still available</h3>' +
                    '<div class="btn-row">' +
                        '<a class="btn" href="' + escapeAttr(client.projectUrl) + '" target="_blank" rel="noopener">' + ICON_OPEN + 'Open the site</a>' +
                    '</div>' +
                '</div>';
        }
    } else {
        const ultra = b.ultra;
        body += '<div class="section"><h3>Open it</h3><div class="btn-row">';
        if (ultra) {
            body +=
                '<a class="btn btn-hero" href="' + escapeAttr(ultra.url) + '" target="_blank" rel="noopener">' + ICON_OPEN +
                    'Open as ' + escapeHtml(ultra.label) +
                    (ultra.declared ? ' (ultra admin)' : ' (highest role)') +
                '</a>';
        }
        body +=
            '<a class="btn btn-hero plain" href="' + escapeAttr(client.projectUrl) + '" target="_blank" rel="noopener">' + ICON_OPEN + 'Open the showcase page</a>' +
            (ultra ? '<button class="btn" type="button" data-copy="' + escapeAttr(ultra.url) + '">' + ICON_COPY + 'Copy link</button>' : '') +
            '</div>';

        if (ultra && !ultra.declared) {
            body += '<p class="footnote">This build does not declare an ultra admin in its showcase.json. ' +
                    '&ldquo;' + escapeHtml(ultra.label) + '&rdquo; is the highest role it offers.</p>';
        }
        body += '</div>';

        if (b.personas && b.personas.length) {
            body += '<div class="section"><h3>Or stand it up as</h3><div class="roles">';
            b.personas.forEach(p => {
                body +=
                    '<a class="role' + (p.isUltra ? ' is-ultra' : '') + '" href="' + escapeAttr(p.url) + '" target="_blank" rel="noopener">' +
                        '<div class="role-top">' +
                            '<span class="role-label">' + escapeHtml(p.label) + '</span>' +
                            (p.isUltra && b.ultra && b.ultra.declared ? '<span class="role-tag">Ultra</span>' : '') +
                        '</div>' +
                        (p.note ? '<div class="role-note">' + escapeHtml(p.note) + '</div>' : '') +
                        '<div class="role-url">' + escapeHtml(p.key ? '?demo=' + p.key : 'signed out') + '</div>' +
                    '</a>';
            });
            body += '</div></div>';
        }
    }

    body +=
        '<div class="section"><h3>Record</h3><dl class="meta">' +
            '<div class="meta-item"><dt>Portal login</dt><dd>' + escapeHtml(client.username || '—') + '</dd></div>' +
            '<div class="meta-item"><dt>Login email</dt><dd>' + escapeHtml(client.email || '—') + '</dd></div>' +
            '<div class="meta-item"><dt>Project URL</dt><dd>' +
                (client.projectUrl
                    ? '<a href="' + escapeAttr(client.projectUrl) + '" target="_blank" rel="noopener">' + escapeHtml(client.projectUrl) + '</a>'
                    : '—') +
            '</dd></div>' +
            '<div class="meta-item"><dt>Created</dt><dd>' + escapeHtml(formatDate(client.createdAt)) + '</dd></div>' +
            '<div class="meta-item"><dt>Last login</dt><dd>' + escapeHtml(formatDate(client.lastLogin)) + '</dd></div>' +
        '</dl></div>';

    if (client.notes) {
        body +=
            '<div class="section"><h3>Notes</h3>' +
                '<div class="notes">' + escapeHtml(client.notes) + '</div>' +
            '</div>';
    }

    host.innerHTML = '<div class="panel">' + head + '<div class="panel-body">' + body + '</div></div>';

    host.querySelectorAll('[data-copy]').forEach(btn => {
        btn.addEventListener('click', () => {
            navigator.clipboard.writeText(btn.dataset.copy)
                .then(() => showToast('Link copied'))
                .catch(() => showToast('Could not copy'));
        });
    });
}

function selectBuild(id) {
    const client = CLIENTS.find(c => c.id === id);
    if (client) {
        renderPanel(client);
        try { localStorage.setItem('gsMasterLast', id); } catch (e) { /* ignore */ }
    }
}

async function load() {
    try {
        const res = await fetch('/api/get-previews', {
            headers: { Authorization: 'Bearer ' + token }
        });

        if (res.status === 401 || res.status === 403) {
            localStorage.removeItem(TOKEN_KEY);
            document.getElementById('panelHost').innerHTML =
                '<div class="msg bad">This account cannot see the master list. Sign in again with the master login.</div>';
            document.getElementById('buildSelect').innerHTML = '<option>Unavailable</option>';
            return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const data = await res.json();
        CLIENTS = data.clients || [];
        document.getElementById('viewerChip').textContent = data.viewer || 'master';

        const select = document.getElementById('buildSelect');

        if (!CLIENTS.length) {
            select.innerHTML = '<option>No builds yet</option>';
            document.getElementById('panelHost').innerHTML =
                '<div class="empty">No client builds on the Clients table yet.</div>';
            return;
        }

        select.innerHTML = CLIENTS.map(c =>
            '<option value="' + escapeAttr(c.id) + '">' +
                escapeHtml(c.company || c.name || 'Untitled') +
                (c.build && c.build.reachable ? '' : '  (website)') +
            '</option>'
        ).join('');

        let last = null;
        try { last = localStorage.getItem('gsMasterLast'); } catch (e) { /* ignore */ }
        const startId = (last && CLIENTS.some(c => c.id === last)) ? last : CLIENTS[0].id;
        select.value = startId;
        selectBuild(startId);

        select.addEventListener('change', () => selectBuild(select.value));
    } catch (err) {
        document.getElementById('buildSelect').innerHTML = '<option>Unavailable</option>';
        document.getElementById('panelHost').innerHTML =
            '<div class="msg bad">Could not load the build list. Check the connection and reload.</div>';
    }
}

document.getElementById('signOutBtn').addEventListener('click', () => {
    ['gsToken', 'gsClientName', 'gsCompany', 'gsUsername', 'gs_token', 'gs_biz', 'gs_user'].forEach(k => localStorage.removeItem(k));
    window.location.href = '/';
});

if (token) load();
</script>
</body>
</html>

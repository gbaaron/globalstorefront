<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shop Local — Global Storefront</title>
<meta name="description" content="Every shop, restaurant and service in town, in one place.">
    <!-- Link preview. The whole pitch is that people don't trust a bare URL
         sent over text, so the preview card has to look like something. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Global Storefront">
    <meta property="og:title" content="Shop Local — Global Storefront">
    <meta property="og:description" content="Every shop, restaurant and service in town, in one place. Follow the ones you love.">
    <meta property="og:image" content="https://globalstorefront.netlify.app/assets/og-image.jpg">
    <meta property="og:image:width" content="1920">
    <meta property="og:image:height" content="1080">
    <meta property="og:url" content="https://globalstorefront.netlify.app/directory.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Shop Local — Global Storefront">
    <meta name="twitter:description" content="Every shop, restaurant and service in town, in one place. Follow the ones you love.">
    <meta name="twitter:image" content="https://globalstorefront.netlify.app/assets/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   THE DIRECTORY — a channel, not an admin panel.
   Nothing here logs a business in. A business appears because Aaron toggled
   them in from the control room. Free listings are deliberately complete;
   paid space buys placement and reach, not basic presence.
   ========================================================================= */
:root{
  --accent:#d4af37;             /* replaced at runtime from the region */
  --accent-ink:#1c1917;
  --accent-soft:rgba(212,175,55,.12);
  --cream:#fdfbf7; --beige:#f5f0e8;
  --g200:#e8e5e0; --g400:#a8a29b; --g500:#78716c; --g700:#44403c; --g900:#1c1917;
  --r:16px;
  --ease:cubic-bezier(.25,.46,.45,.94);
  --t:.3s var(--ease);
  --shadow:0 1px 3px rgba(28,25,23,.06),0 8px 24px rgba(28,25,23,.05);
  --shadow-lg:0 4px 14px rgba(28,25,23,.08),0 24px 56px rgba(28,25,23,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--g900);line-height:1.6;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}

header{position:sticky;top:0;z-index:40;background:rgba(253,251,247,.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--g200)}
.bar{display:flex;align-items:center;gap:14px;padding:13px 20px;max-width:1140px;margin:0 auto}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.bar h1{font-size:16.5px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.bar .sub{font-size:12px;color:var(--g500)}
.bar-cta{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:99px;border:1.5px solid transparent;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:var(--t);white-space:nowrap}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);filter:brightness(1.07)}
.btn-line{background:#fff;border-color:var(--g200);color:var(--g900)}
.btn-line:hover{border-color:var(--accent);color:var(--g900);transform:translateY(-2px)}
.btn-line.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:7px 14px;font-size:13px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--g200)}
.hero::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 800px 460px at 14% 0%,var(--accent-soft),transparent 60%),
             radial-gradient(ellipse 700px 420px at 86% 40%,var(--accent-soft),transparent 60%)}
.hero-in{position:relative;padding:clamp(46px,8vw,86px) 0 clamp(34px,5vw,54px)}
.hero h2{font-family:'Playfair Display',Georgia,serif;font-size:clamp(2.2rem,6.5vw,3.7rem);font-weight:700;letter-spacing:-.03em;line-height:1.05;max-width:16ch}
.hero p{font-size:clamp(1rem,2.2vw,1.2rem);color:var(--g700);margin-top:16px;max-width:44ch;line-height:1.55}
.counts{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.count b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.count span{font-size:13px;color:var(--g500)}

/* ---------- controls ---------- */
.controls{position:sticky;top:61px;z-index:30;background:rgba(253,251,247,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--g200);padding:14px 0}
.controls .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:190px;position:relative}
.search input{width:100%;padding:11px 16px 11px 42px;border:1px solid var(--g200);border-radius:99px;background:#fff;font:inherit;font-size:14.5px;transition:var(--t)}
.search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--g400)}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.filters::-webkit-scrollbar{display:none}

/* ---------- cards ---------- */
.list{padding:34px 0 70px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(282px,1fr))}
.biz{
  background:#fff;border:1px solid var(--g200);border-radius:var(--r);overflow:hidden;
  transition:var(--t);display:flex;flex-direction:column;position:relative;
}
.biz:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:transparent}
.biz.paid{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft),var(--shadow)}
.biz.paid::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:var(--accent);z-index:2}

/* A brand-tinted panel, never an emoji, when a business has no photo. */
.biz-top{height:112px;position:relative;background:linear-gradient(135deg,var(--bc,#8a6a3a) 0%,color-mix(in srgb,var(--bc,#8a6a3a) 55%,#000) 100%)}
.biz-top::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.13) 1px,transparent 1.6px);background-size:18px 18px}
.biz-logo{
  position:absolute;left:18px;bottom:-22px;width:52px;height:52px;border-radius:14px;
  object-fit:cover;border:3px solid #fff;background:#fff;box-shadow:var(--shadow);z-index:3;
}
.biz-logo-fb{
  position:absolute;left:18px;bottom:-22px;width:52px;height:52px;border-radius:14px;z-index:3;
  border:3px solid #fff;background:var(--bc,#8a6a3a);color:#fff;display:grid;place-items:center;
  font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:700;box-shadow:var(--shadow);
}
.biz-b{padding:32px 18px 18px;flex:1;display:flex;flex-direction:column}
.biz-b h3{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.biz-b .tag{font-size:13.5px;color:var(--g500);margin-top:5px;line-height:1.5;flex:1}
.biz-meta{display:flex;align-items:center;gap:9px;margin-top:13px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--beige);color:var(--g700)}
.chip.open{background:#dcfce7;color:#15803d}
.chip.shut{background:#f5f5f4;color:var(--g500)}
.chip.top{background:var(--accent);color:var(--accent-ink)}
.biz-actions{display:flex;gap:8px;margin-top:15px}
.biz-actions .btn{flex:1}

/* ---------- region chooser ---------- */
.regions{padding:44px 0 70px}
.rgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(262px,1fr))}
.region{
  background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:26px;
  transition:var(--t);position:relative;overflow:hidden;
}
.region.live:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:transparent}
.region::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:var(--rc,#d4af37)}
.region h3{font-family:'Playfair Display',Georgia,serif;font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.region p{font-size:14px;color:var(--g500);margin-top:8px;line-height:1.6}
.region .state{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g400);margin-bottom:8px}
.region.soon{opacity:.72;background:var(--beige)}

/* ---------- auth sheet ---------- */
.sheet{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(28,25,23,.55);backdrop-filter:blur(4px)}
.sheet.on{display:flex}
.sheet-in{background:#fff;border-radius:20px;padding:30px;max-width:400px;width:100%;box-shadow:var(--shadow-lg);position:relative}
.sheet h3{font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.sheet p{font-size:14px;color:var(--g500);margin-top:7px;margin-bottom:20px}
.sheet label{display:block;font-size:12.5px;font-weight:600;color:var(--g700);margin-bottom:5px}
.sheet input{width:100%;padding:11px 14px;border:1px solid var(--g200);border-radius:10px;font:inherit;font-size:14.5px;margin-bottom:13px}
.sheet input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sheet .x{position:absolute;right:16px;top:16px;width:30px;height:30px;border:0;background:var(--beige);border-radius:50%;cursor:pointer;font-size:17px;color:var(--g500);line-height:1}
.swap{text-align:center;font-size:13.5px;color:var(--g500);margin-top:15px}
.swap button{background:0;border:0;color:var(--g900);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}

footer{background:var(--g900);color:#fff;padding:44px 0 30px}
footer p{font-size:13.5px;color:rgba(255,255,255,.6)}
footer .powered{border-top:1px solid rgba(255,255,255,.1);margin-top:22px;padding-top:18px;font-size:12.5px;color:rgba(255,255,255,.4)}

.empty{text-align:center;padding:70px 20px;color:var(--g500)}
.empty h3{font-family:'Playfair Display',Georgia,serif;font-size:1.5rem;color:var(--g900);margin-bottom:9px}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .65s var(--ease),transform .65s var(--ease)}
.reveal.in{opacity:1;transform:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,130%);z-index:90;padding:13px 22px;border-radius:99px;background:var(--g900);color:#fff;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);transition:transform .32s var(--ease);max-width:min(440px,90vw);text-align:center}
.toast.up{transform:translate(-50%,0)}
.boot{display:grid;place-items:center;min-height:60vh;gap:14px;color:var(--g500)}
.spin{width:24px;height:24px;border:2.5px solid var(--g200);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
@media(max-width:600px){.controls{top:59px}.counts{gap:18px}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="mark" id="mark">G</div>
    <div>
      <h1 id="title">Shop Local</h1>
      <div class="sub" id="subtitle">Global Storefront</div>
    </div>
    <div class="bar-cta" id="cta"></div>
  </div>
</header>

<div id="boot" class="boot"><div class="spin"></div><p>Loading…</p></div>
<main id="app" class="hidden"></main>

<footer>
  <div class="wrap">
    <p id="footNote">Local businesses, in one place.</p>
    <div class="powered">Global Storefront — operated by Globally Ballin LLC dba Global Storefront</div>
  </div>
</footer>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <button class="x" onclick="closeSheet()" aria-label="Close">&times;</button>
    <h3 id="shTitle">Create an account</h3>
    <p id="shSub">Follow the places you love and hear from them first.</p>
    <div id="shName"><label for="aName">Name</label><input id="aName" autocomplete="name"></div>
    <label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email">
    <label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password">
    <button class="btn btn-accent" style="width:100%" id="shGo">Create account</button>
    <div class="swap" id="shSwap"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
const P = new URLSearchParams(location.search);
const REGION = P.get('region') || P.get('r') || '';

const S = {
  data:null, region:null, tenants:[], filter:'all', q:'', openOnly:false,
  user:null, token:localStorage.getItem('gs_user_token') || null,
  following:new Set(), mode:'signup', pendingFollow:P.get('follow') || null,
  back:P.get('back') || null
};

const $ = (s,r)=>(r||document).querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/** First letter or digit of a name — punctuation makes a poor monogram. */
function initialOf(s){
  const m = String(s||'').match(/[\p{L}\p{N}]/u);
  return m ? m[0].toUpperCase() : '?';
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('up'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('up'),3400); }

const ICONS = {
  search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',
  heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z',
  link:'M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7L12 19'
};
const ic = (n,sz) => `<svg width="${sz||16}" height="${sz||16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[n]}"/></svg>`;

/* ---------- boot ---------- */
(async function(){
  try {
    const url = REGION ? `${API}/get-directory?region=${encodeURIComponent(REGION)}` : `${API}/get-directory`;
    const res = await fetch(url);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not load');
    S.data = data;

    if (S.token) await loadMe();

    if (data.regions) paintRegions(data);
    else paintDirectory(data);

    if (P.get('join') === '1') openSheet('signup');
  } catch(e){
    $('#boot').innerHTML = `<p>${esc(e.message)}</p>`;
  }
})();

async function loadMe(){
  try {
    const res = await fetch(`${API}/user-auth`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + S.token },
      body: JSON.stringify({ action:'me' })
    });
    const d = await res.json();
    if (!res.ok) { S.token = null; localStorage.removeItem('gs_user_token'); return; }
    S.user = d.user;
    S.following = new Set((d.following||[]).map(f => f.tenantId));
  } catch(e){ /* browsing works signed out */ }
}

/* ---------- region chooser ---------- */
function paintRegions(d){
  document.title = 'Shop Local — Global Storefront';
  $('#title').textContent = 'Shop Local';
  $('#subtitle').textContent = `${d.live} ${d.live === 1 ? 'town' : 'towns'} live`;
  paintCta();

  $('#app').innerHTML = `
    <div class="hero"><div class="hero-in wrap">
      <h2>Your town, all in one place</h2>
      <p>The shops, restaurants and services near you — with hours you can trust and news straight from the owners.</p>
    </div></div>
    <div class="regions"><div class="wrap">
      <div class="rgrid">
        ${(d.regions||[]).map(r => `
          <a class="region reveal ${r.status === 'live' ? 'live' : 'soon'}"
             style="--rc:${esc(r.accentColor)}"
             ${r.status === 'live' ? `href="?region=${esc(r.slug)}"` : ''}>
            <div class="state">${r.status === 'live' ? 'Open' : 'Coming soon'}</div>
            <h3>${esc(r.name)}</h3>
            <p>${esc(r.blurb)}</p>
            ${r.status === 'live' && r.tenantCount ? `<div class="biz-meta"><span class="chip">${r.tenantCount} businesses</span></div>` : ''}
          </a>`).join('')}
      </div>
    </div></div>`;

  done();
}

/* ---------- directory ---------- */
function paintDirectory(d){
  S.region = d.region;
  S.tenants = d.tenants || [];

  document.documentElement.style.setProperty('--accent', d.region.accentColor || '#d4af37');
  document.documentElement.style.setProperty('--accent-soft', hexA(d.region.accentColor || '#d4af37', .12));
  document.documentElement.style.setProperty('--accent-ink', readable(d.region.accentColor || '#d4af37'));

  document.title = `${d.region.name} — Global Storefront`;
  $('#title').textContent = d.region.name;
  $('#subtitle').textContent = [d.region.city, d.region.state].filter(Boolean).join(', ');
  $('#mark').textContent = initialOf(d.region.city || d.region.name);
  $('#footNote').textContent = `${d.region.name} — local businesses, in one place.`;
  paintCta();

  if (!d.live){
    $('#app').innerHTML = `
      <div class="hero"><div class="hero-in wrap">
        <h2>${esc(d.region.name)} is on the way</h2>
        <p>${esc(d.message || "We haven't launched here yet.")}</p>
        <div style="margin-top:26px"><a class="btn btn-line" href="?">See where we are live</a></div>
      </div></div>`;
    done();
    return;
  }

  const c = d.counts || {};
  $('#app').innerHTML = `
    <div class="hero"><div class="hero-in wrap">
      <h2>${esc(d.region.blurb ? d.region.name : 'Shop local')}</h2>
      <p>${esc(d.region.blurb || '')}</p>
      <div class="counts">
        <div class="count"><b>${c.total||0}</b><span>businesses</span></div>
        <div class="count"><b>${c.openNow||0}</b><span>open now</span></div>
        <div class="count"><b>${(d.categories||[]).length}</b><span>categories</span></div>
      </div>
    </div></div>

    <div class="controls"><div class="wrap">
      <div class="search">
        ${ic('search',17)}
        <input id="q" type="search" placeholder="Search ${esc(d.region.city || 'here')}…" aria-label="Search">
      </div>
      <div class="filters">
        <button class="btn btn-line btn-sm on" data-f="all">All</button>
        <button class="btn btn-line btn-sm" data-f="open">Open now</button>
        ${(d.categories||[]).map(cat => `<button class="btn btn-line btn-sm" data-f="cat:${esc(cat)}">${esc(cat)}</button>`).join('')}
      </div>
    </div></div>

    <div class="list"><div class="wrap"><div class="grid" id="grid"></div></div></div>`;

  $('#q').oninput = e => { S.q = e.target.value.toLowerCase(); renderGrid(); };
  document.querySelectorAll('[data-f]').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('[data-f]').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      S.filter = b.dataset.f;
      renderGrid();
    };
  });

  renderGrid();
  done();
}

function renderGrid(){
  let list = S.tenants.slice();

  if (S.q){
    list = list.filter(t =>
      t.name.toLowerCase().includes(S.q) ||
      (t.tagline||'').toLowerCase().includes(S.q) ||
      (t.category||'').toLowerCase().includes(S.q));
  }
  if (S.filter === 'open') list = list.filter(t => t.openNow && t.openNow.open);
  else if (S.filter.startsWith('cat:')) list = list.filter(t => t.category === S.filter.slice(4));

  const grid = $('#grid');
  if (!list.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <h3>Nothing matches that</h3>
      <p>Try a different word, or clear the filters.</p>
    </div>`;
    return;
  }

  grid.innerHTML = list.map(t => {
    const initial = initialOf(t.name);
    const following = S.following.has(t.id);
    const href = t.linkOut || `/space.html?s=${encodeURIComponent(t.slug)}&surface=directory&region=${encodeURIComponent(S.region.slug)}`;
    return `<article class="biz reveal ${t.paid?'paid':''}" style="--bc:${esc(t.brandColor||'#8a6a3a')}">
      <a href="${esc(href)}" ${t.linkOut?'target="_blank" rel="noopener"':''}>
        <div class="biz-top">
          ${t.logoUrl
            ? `<img class="biz-logo" src="${esc(t.logoUrl)}" alt="${esc(t.name)}" loading="lazy">`
            : `<div class="biz-logo-fb">${esc(initial)}</div>`}
        </div>
      </a>
      <div class="biz-b">
        <a href="${esc(href)}" ${t.linkOut?'target="_blank" rel="noopener"':''}><h3>${esc(t.name)}</h3></a>
        <p class="tag">${esc(t.tagline || '')}</p>
        <div class="biz-meta">
          ${t.openNow ? `<span class="chip ${t.openNow.open?'open':'shut'}">${t.openNow.open?'Open now':'Closed'}</span>` : ''}
          ${t.category ? `<span class="chip">${esc(t.category)}</span>` : ''}
          ${t.followers ? `<span class="chip">${t.followers} ${t.followers===1?'follower':'followers'}</span>` : ''}
          ${t.features && t.features.bookings ? `<span class="chip">Bookings</span>` : ''}
        </div>
        <div class="biz-actions">
          <a class="btn btn-line btn-sm" href="${esc(href)}" ${t.linkOut?'target="_blank" rel="noopener"':''}>
            ${t.linkOut ? ic('link') + ' Visit' : 'View'}
          </a>
          ${t.followable ? `<button class="btn ${following?'btn-accent':'btn-line'} btn-sm" data-follow="${t.id}">
            ${ic('heart')} ${following?'Following':'Follow'}
          </button>` : ''}
        </div>
      </div>
    </article>`;
  }).join('');

  grid.querySelectorAll('[data-follow]').forEach(b => {
    b.onclick = () => follow(b.dataset.follow, b);
  });

  reveal();
}

/* ---------- follow ---------- */
async function follow(tenantId, btn){
  if (!S.token){
    S.pendingFollow = tenantId;
    openSheet('signup');
    return;
  }
  const was = S.following.has(tenantId);
  try {
    const res = await fetch(`${API}/manage-follow`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + S.token },
      body: JSON.stringify({ action: was ? 'unfollow' : 'follow', tenantId })
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error);

    if (was) S.following.delete(tenantId); else S.following.add(tenantId);
    if (btn){
      btn.className = `btn ${S.following.has(tenantId)?'btn-accent':'btn-line'} btn-sm`;
      btn.innerHTML = ic('heart') + ' ' + (S.following.has(tenantId) ? 'Following' : 'Follow');
    }
    toast(was ? 'Unfollowed.' : (d.message || "You'll hear from them first."));
  } catch(e){ toast(e.message); }
}

/* ---------- auth ---------- */
function openSheet(mode){
  S.mode = mode;
  const signup = mode === 'signup';
  $('#shTitle').textContent = signup ? 'Create an account' : 'Welcome back';
  $('#shSub').textContent = signup
    ? 'Follow the places you love and hear from them first.'
    : 'Sign in to keep up with the places you follow.';
  $('#shName').style.display = signup ? '' : 'none';
  $('#shGo').textContent = signup ? 'Create account' : 'Sign in';
  $('#aPass').autocomplete = signup ? 'new-password' : 'current-password';
  $('#shSwap').innerHTML = signup
    ? `Already have one? <button onclick="openSheet('login')">Sign in</button>`
    : `New here? <button onclick="openSheet('signup')">Create an account</button>`;
  $('#sheet').classList.add('on');
  setTimeout(() => $(signup ? '#aName' : '#aEmail').focus(), 60);
}
function closeSheet(){ $('#sheet').classList.remove('on'); }

$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

$('#shGo').onclick = async () => {
  const btn = $('#shGo');
  const email = $('#aEmail').value.trim();
  const password = $('#aPass').value;
  const name = $('#aName').value.trim();
  if (!email || !password) return toast('Email and password, please.');

  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = 'One moment…';
  try {
    const res = await fetch(`${API}/user-auth`, {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        action: S.mode, email, password, name,
        regionSlug: S.region ? S.region.slug : undefined,
        followTenantId: S.pendingFollow || undefined
      })
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error);

    S.token = d.token;
    localStorage.setItem('gs_user_token', d.token);
    S.user = d.user;

    await loadMe();
    closeSheet();
    paintCta();

    if (S.back){ location.href = S.back; return; }

    if (S.pendingFollow && !S.following.has(S.pendingFollow)){
      await follow(S.pendingFollow, null);
    }
    S.pendingFollow = null;
    if (S.region) renderGrid();
    toast(`Welcome${d.user.name ? ', ' + d.user.name.split(' ')[0] : ''}.`);
  } catch(e){
    toast(e.message);
  }
  btn.disabled = false;
  btn.textContent = label;
};

function paintCta(){
  $('#cta').innerHTML = S.user
    ? `<span style="font-size:13.5px;color:var(--g500)">${esc((S.user.name||S.user.email).split(' ')[0])}</span>
       <button class="btn btn-line btn-sm" onclick="signOut()">Sign out</button>`
    : `<button class="btn btn-accent btn-sm" onclick="openSheet('signup')">Sign up</button>`;
}

function signOut(){
  localStorage.removeItem('gs_user_token');
  S.token = null; S.user = null; S.following = new Set();
  paintCta();
  if (S.region) renderGrid();
  toast('Signed out.');
}

/* ---------- helpers ---------- */
function done(){ $('#boot').classList.add('hidden'); $('#app').classList.remove('hidden'); reveal(); }

function hexA(hex,a){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function readable(hex){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  const [r,g,b] = [(n>>16)&255,(n>>8)&255,n&255].map(v => {
    const s = v/255;
    return s <= .03928 ? s/12.92 : Math.pow((s+.055)/1.055, 2.4);
  });
  return (.2126*r + .7152*g + .0722*b) > .42 ? '#1c1917' : '#ffffff';
}
function reveal(){
  const els = document.querySelectorAll('.reveal:not(.in)');
  if (!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(en => {
    en.forEach((e,i) => {
      if (e.isIntersecting){ setTimeout(() => e.target.classList.add('in'), i*45); io.unobserve(e.target); }
    });
  }, { threshold:.1, rootMargin:'0px 0px -30px' });
  els.forEach(e => io.observe(e));
}
</script>

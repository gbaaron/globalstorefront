<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Loading…</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   THE TENANT SPACE — one renderer, four wrappers.
   This page IS the business's homepage, their website, the inside of their
   app, and their directory detail view. ?surface= only changes the chrome.
   Everything it shows comes from /api/get-space.
   ========================================================================= */
:root{
  --brand:#8a6a3a;          /* replaced at runtime from the tenant's own colour */
  --brand-ink:#fff;
  --brand-soft:rgba(138,106,58,.10);
  --cream:#fdfbf7; --warm:#fffaf5; --beige:#f5f0e8;
  --g100:#f8f7f5; --g200:#e8e5e0; --g400:#a8a29b; --g500:#78716c; --g700:#44403c; --g900:#1c1917;
  --r:16px; --r-sm:10px;
  --ease:cubic-bezier(.25,.46,.45,.94);
  --t:.3s var(--ease);
  --shadow:0 1px 3px rgba(28,25,23,.06),0 8px 24px rgba(28,25,23,.05);
  --shadow-lg:0 4px 12px rgba(28,25,23,.08),0 20px 50px rgba(28,25,23,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--g900);
  line-height:1.6;-webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
img{display:block;max-width:100%}
a{color:inherit}

.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;background:rgba(253,251,247,.93);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--g200);
}
.bar{display:flex;align-items:center;gap:14px;padding:13px 0;max-width:1080px;margin:0 auto;padding-left:20px;padding-right:20px}
.logo{width:40px;height:40px;border-radius:11px;object-fit:cover;flex:none;box-shadow:var(--shadow)}
.logo-fb{
  width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:17px;letter-spacing:-.02em;
}
.bar-name{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.bar-meta{font-size:12.5px;color:var(--g500)}
.bar-cta{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--g200)}
.hero::before{
  content:'';position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 700px 420px at 12% 0%,var(--brand-soft),transparent 60%),
    radial-gradient(ellipse 600px 400px at 88% 30%,var(--brand-soft),transparent 60%);
}
.hero-in{position:relative;z-index:1;padding:clamp(48px,9vw,96px) 0 clamp(40px,7vw,72px)}
.hero h1{
  font-family:'Playfair Display',Georgia,serif;font-weight:700;
  font-size:clamp(2.3rem,7vw,4rem);line-height:1.05;letter-spacing:-.03em;max-width:15ch;
}
.hero .tag{font-size:clamp(1.02rem,2.3vw,1.22rem);color:var(--g700);margin-top:18px;max-width:38ch;line-height:1.55}
.hero-row{display:flex;gap:11px;flex-wrap:wrap;margin-top:28px;align-items:center}

.open{
  display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;
  font-size:13px;font-weight:600;background:#fff;border:1px solid var(--g200);box-shadow:var(--shadow);
}
.open .dot{width:8px;height:8px;border-radius:50%;background:#16a34a;flex:none;box-shadow:0 0 0 3px rgba(22,163,74,.18)}
.open.shut .dot{background:var(--g400);box-shadow:0 0 0 3px rgba(168,162,155,.2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:99px;border:1.5px solid transparent;
  font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;transition:var(--t);
  text-decoration:none;white-space:nowrap;
}
.btn-brand{background:var(--brand);color:var(--brand-ink)}
.btn-brand:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);filter:brightness(1.08)}
.btn-line{background:#fff;border-color:var(--g200);color:var(--g900)}
.btn-line:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-2px)}
.btn-sm{padding:8px 15px;font-size:13px}
.btn.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* ---------- sections ---------- */
section{padding:clamp(44px,7vw,76px) 0}
section + section{border-top:1px solid var(--g200)}
.sec-h{margin-bottom:30px}
.sec-h h2{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.6rem,4vw,2.3rem);font-weight:700;letter-spacing:-.025em;line-height:1.15}
.sec-h p{color:var(--g500);margin-top:8px;font-size:15px;max-width:52ch}

.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}

.card{
  background:#fff;border:1px solid var(--g200);border-radius:var(--r);
  overflow:hidden;transition:var(--t);position:relative;
}
.card::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:var(--brand);opacity:0;transition:var(--t);z-index:2}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:transparent}
.card:hover::before{opacity:1}
.card-b{padding:20px}
.card h3{font-size:16.5px;font-weight:700;letter-spacing:-.02em;margin-bottom:7px}
.card p{font-size:14px;color:var(--g500);line-height:1.6}

/* Real photo when there is one; a brand-tinted panel when there is not.
   Never an emoji standing in for a product shot. */
.shot{aspect-ratio:4/3;object-fit:cover;width:100%;background:var(--beige)}
.shot-fb{
  aspect-ratio:4/3;width:100%;position:relative;
  background:linear-gradient(135deg,var(--brand) 0%,color-mix(in srgb,var(--brand) 55%,#000) 100%);
}
.shot-fb::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.14) 1px,transparent 1.6px);
  background-size:18px 18px;
}
.shot-fb span{
  position:absolute;inset:0;display:grid;place-items:center;z-index:1;
  font-family:'Playfair Display',Georgia,serif;font-size:2.4rem;font-weight:700;
  color:rgba(255,255,255,.9);letter-spacing:-.03em;
}

.price{font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--brand);margin-top:10px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--beige);color:var(--g700)}
.pill.out{background:#fef2f2;color:#b91c1c}

/* ---------- hours ---------- */
.hours{background:#fff;border:1px solid var(--g200);border-radius:var(--r);overflow:hidden;max-width:520px}
.hr{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;border-bottom:1px solid var(--g200);font-size:14.5px}
.hr:last-child{border-bottom:0}
.hr.today{background:var(--brand-soft);font-weight:600}
.hr .d{text-transform:capitalize}
.hr .t{color:var(--g500);font-variant-numeric:tabular-nums}
.hr.today .t{color:var(--g900)}
.hr .t.shut{color:var(--g400)}

/* ---------- filters ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}

/* ---------- footer ---------- */
footer{background:var(--g900);color:#fff;padding:48px 0 34px;margin-top:0}
footer .wrap{display:flex;gap:28px;flex-wrap:wrap;justify-content:space-between}
footer h4{font-size:15px;font-weight:700;margin-bottom:10px;letter-spacing:-.01em}
footer p,footer a{font-size:13.5px;color:rgba(255,255,255,.62);line-height:1.8;text-decoration:none}
footer a:hover{color:#fff}
.powered{border-top:1px solid rgba(255,255,255,.1);margin-top:30px;padding-top:20px;font-size:12.5px;color:rgba(255,255,255,.4)}

/* ---------- bits ---------- */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,130%);z-index:90;
  padding:13px 22px;border-radius:99px;background:var(--g900);color:#fff;
  font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);transition:transform .32s var(--ease);
  max-width:min(440px,90vw);text-align:center;
}
.toast.up{transform:translate(-50%,0)}
.boot{display:grid;place-items:center;min-height:70vh;color:var(--g500);gap:14px}
.spin{width:24px;height:24px;border:2.5px solid var(--g200);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}

@media(max-width:700px){
  .bar-meta{display:none}
  .hero h1{max-width:100%}
  footer .wrap{flex-direction:column;gap:22px}
}
</style>
</head>
<body>

<div id="boot" class="boot"><div class="spin"></div><p>Loading…</p></div>

<div id="app" class="hidden">
  <header>
    <div class="bar">
      <div id="barLogo"></div>
      <div>
        <div class="bar-name" id="barName"></div>
        <div class="bar-meta" id="barMeta"></div>
      </div>
      <div class="bar-cta" id="barCta"></div>
    </div>
  </header>

  <div class="hero">
    <div class="hero-in wrap">
      <h1 id="heroName"></h1>
      <p class="tag" id="heroTag"></p>
      <div class="hero-row" id="heroRow"></div>
    </div>
  </div>

  <main id="body"></main>

  <footer>
    <div class="wrap">
      <div>
        <h4 id="fName"></h4>
        <p id="fAddr"></p>
        <p id="fPhone"></p>
      </div>
      <div id="fHours"></div>
    </div>
    <div class="wrap"><div class="powered" style="width:100%">Powered by Global Storefront</div></div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
const P = new URLSearchParams(location.search);
const SLUG = P.get('s') || P.get('slug') || '';
const SURFACE = P.get('surface') || 'space';
const REGION = P.get('region') || '';

const S = { space:null, user:null, following:false, filter:'all' };

const $ = (s,r)=>(r||document).querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + (Number(n)||0).toFixed(2);
/** First letter or digit of a name — punctuation makes a poor monogram. */
function initialOf(s){
  const m = String(s||'').match(/[\p{L}\p{N}]/u);
  return m ? m[0].toUpperCase() : '?';
}


function toast(m){
  const t=$('#toast'); t.textContent=m; t.classList.add('up');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('up'),3400);
}

const ICONS = {
  heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z',
  cal:'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
  pin:'M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0zM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  link:'M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7L12 19'
};
const ic = n => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[n]}"/></svg>`;

/* ---------- boot ---------- */
(async function(){
  if (!SLUG){ $('#boot').innerHTML = '<p>No business specified.</p>'; return; }
  try {
    const res = await fetch(`${API}/get-space?slug=${encodeURIComponent(SLUG)}&surface=${encodeURIComponent(SURFACE)}${REGION?`&region=${encodeURIComponent(REGION)}`:''}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Not found');

    // A link-out business has no space of its own — send people to their site.
    if (data.mode === 'link_out' && data.redirect){
      location.replace(data.redirect);
      return;
    }

    S.space = data;
    paint();
  } catch(e){
    $('#boot').innerHTML = `<p>${esc(e.message)}</p>`;
  }
})();

function paint(){
  const d = S.space, t = d.tenant;

  document.title = t.name;
  const meta = document.querySelector('meta[name=description]');
  if (meta) meta.content = t.tagline || t.name;

  // The space wears the tenant's own colour.
  document.documentElement.style.setProperty('--brand', t.brandColor || '#8a6a3a');
  document.documentElement.style.setProperty('--brand-soft', hexA(t.brandColor || '#8a6a3a', .10));
  document.documentElement.style.setProperty('--brand-ink', readable(t.brandColor || '#8a6a3a'));

  const initial = initialOf(t.name);
  const logo = t.logoUrl
    ? `<img class="logo" src="${esc(t.logoUrl)}" alt="${esc(t.name)}">`
    : `<div class="logo-fb">${esc(initial)}</div>`;
  $('#barLogo').innerHTML = logo;
  $('#barName').textContent = t.name;
  $('#barMeta').textContent = t.tagline || '';

  $('#heroName').textContent = t.name;
  $('#heroTag').textContent = t.tagline || '';

  // hero row: open-now + primary actions
  const open = d.openNow;
  const bits = [];
  if (open){
    bits.push(`<span class="open ${open.open?'':'shut'}"><span class="dot"></span>${open.open?'Open now':'Closed now'}${open.today && !open.today.closed && open.today.open?` · ${fmt(open.today.open)}–${fmt(open.today.close)}`:''}</span>`);
  }
  if (d.features.bookings) bits.push(`<a class="btn btn-brand" href="#book">${ic('cal')} Book a time</a>`);
  if (d.features.follow) bits.push(`<button class="btn btn-line" id="followBtn">${ic('heart')} Follow</button>`);
  if (t.websiteUrl && SURFACE === 'directory') bits.push(`<a class="btn btn-line" href="${esc(t.websiteUrl)}" target="_blank" rel="noopener">${ic('link')} Their site</a>`);
  $('#heroRow').innerHTML = bits.join('');

  $('#barCta').innerHTML = d.features.follow ? `<button class="btn btn-brand btn-sm" id="followTop">${ic('heart')} Follow</button>` : '';

  // body
  const parts = [];

  const about = (d.content||[]).filter(c => c.kind === 'about' || c.kind === 'hero');
  const news  = (d.content||[]).filter(c => c.kind === 'announcement');
  const other = (d.content||[]).filter(c => !['about','hero','announcement'].includes(c.kind));

  if (news.length){
    parts.push(`<section><div class="wrap">
      <div class="sec-h reveal"><h2>What's new</h2></div>
      <div class="grid g2">${news.map(c => card(c)).join('')}</div>
    </div></section>`);
  }

  if (about.length){
    parts.push(`<section><div class="wrap">
      <div class="sec-h reveal"><h2>${esc(about[0].title || 'About')}</h2></div>
      <div style="max-width:60ch;font-size:16.5px;line-height:1.75;color:var(--g700)" class="reveal">${esc(about[0].body).replace(/\n/g,'<br>')}</div>
    </div></section>`);
  }

  if ((d.items||[]).length){
    const cats = Array.from(new Set(d.items.map(i => i.category).filter(Boolean)));
    parts.push(`<section id="menu"><div class="wrap">
      <div class="sec-h reveal"><h2>${esc(t.siteType === 'restaurant' ? 'Menu' : 'What we have')}</h2></div>
      ${cats.length > 1 ? `<div class="tabs" id="cats">
        <button class="btn btn-line btn-sm on" data-cat="all">All</button>
        ${cats.map(c => `<button class="btn btn-line btn-sm" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
      </div>` : ''}
      <div class="grid g3" id="items">${d.items.map(itemCard).join('')}</div>
    </div></section>`);
  }

  if ((d.events||[]).length){
    parts.push(`<section><div class="wrap">
      <div class="sec-h reveal"><h2>Coming up</h2><p>Save your spot.</p></div>
      <div class="grid g2">${d.events.map(eventCard).join('')}</div>
    </div></section>`);
  }

  if ((d.hours||[]).length){
    const days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    const today = days[new Date().getDay()];
    parts.push(`<section id="book"><div class="wrap">
      <div class="sec-h reveal"><h2>Hours</h2>${t.address?`<p>${esc(t.address)}</p>`:''}</div>
      <div class="hours reveal">
        ${d.hours.map(h => `
          <div class="hr ${h.day===today?'today':''}">
            <span class="d">${esc(h.day)}</span>
            <span class="t ${h.closed?'shut':''}">${h.closed || !h.open ? 'Closed' : `${fmt(h.open)} – ${fmt(h.close)}`}</span>
          </div>`).join('')}
      </div>
      ${d.features.bookings ? `<button class="btn btn-brand" style="margin-top:22px" onclick="toast('Booking opens from your directory listing.')">${ic('cal')} Book a time</button>` : ''}
    </div></section>`);
  }

  if (other.length){
    parts.push(`<section><div class="wrap">
      <div class="grid g2">${other.map(c => card(c)).join('')}</div>
    </div></section>`);
  }

  $('#body').innerHTML = parts.join('');

  // footer
  $('#fName').textContent = t.name;
  $('#fAddr').textContent = t.address || '';
  $('#fPhone').textContent = t.phone || '';
  const openDays = (d.hours||[]).filter(h => !h.closed && h.open);
  $('#fHours').innerHTML = openDays.length
    ? `<h4>Hours</h4>${openDays.map(h => `<p style="text-transform:capitalize">${esc(h.day)} · ${fmt(h.open)}–${fmt(h.close)}</p>`).join('')}`
    : '';

  $('#boot').classList.add('hidden');
  $('#app').classList.remove('hidden');

  wire();
  revealOnScroll();
}

function card(c){
  return `<article class="card reveal">
    ${c.imageUrl ? `<img class="shot" src="${esc(c.imageUrl)}" alt="${esc(c.title)}" loading="lazy">` : ''}
    <div class="card-b">
      <h3>${esc(c.title)}</h3>
      <p>${esc(c.body)}</p>
    </div>
  </article>`;
}

function itemCard(i){
  const initial = initialOf(i.name);
  return `<article class="card reveal" data-cat="${esc(i.category||'')}">
    ${i.imageUrl
      ? `<img class="shot" src="${esc(i.imageUrl)}" alt="${esc(i.name)}" loading="lazy">`
      : `<div class="shot-fb"><span>${esc(initial)}</span></div>`}
    <div class="card-b">
      ${i.status === 'sold_out' ? `<span class="pill out">Sold out</span>` : i.status === 'coming_soon' ? `<span class="pill">Soon</span>` : ''}
      <h3 style="margin-top:${i.status!=='active'?'9px':'0'}">${esc(i.name)}</h3>
      ${i.description ? `<p>${esc(i.description)}</p>` : ''}
      ${i.price ? `<div class="price">${money(i.price)}</div>` : ''}
      ${i.status === 'sold_out' && S.space.features.restock
        ? `<button class="btn btn-line btn-sm" style="margin-top:13px" onclick="restock('${i.id}')">Tell me when it's back</button>` : ''}
    </div>
  </article>`;
}

function eventCard(e){
  return `<article class="card reveal">
    ${e.imageUrl ? `<img class="shot" src="${esc(e.imageUrl)}" alt="${esc(e.title)}" loading="lazy">` : ''}
    <div class="card-b">
      <h3>${esc(e.title)}</h3>
      <p style="color:var(--brand);font-weight:600;margin:6px 0">${esc(when(e.startsAt))}</p>
      ${e.description ? `<p>${esc(e.description)}</p>` : ''}
      ${e.capacity ? `<p style="margin-top:9px;font-size:13px">${e.signupCount >= e.capacity ? 'Full — join the waitlist' : `${e.capacity - e.signupCount} spots left`}</p>` : ''}
      <button class="btn btn-brand btn-sm" style="margin-top:13px" onclick="signup('${e.id}')">${e.capacity && e.signupCount >= e.capacity ? 'Join waitlist' : 'Save my spot'}</button>
    </div>
  </article>`;
}

/* ---------- interactions ---------- */
function wire(){
  const cats = $('#cats');
  if (cats){
    cats.querySelectorAll('[data-cat]').forEach(b => {
      b.onclick = () => {
        cats.querySelectorAll('[data-cat]').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        const c = b.dataset.cat;
        $('#items').querySelectorAll('.card').forEach(card => {
          card.style.display = (c === 'all' || card.dataset.cat === c) ? '' : 'none';
        });
      };
    });
  }

  ['#followBtn','#followTop'].forEach(sel => {
    const b = $(sel);
    if (b) b.onclick = follow;
  });
}

async function follow(){
  const token = localStorage.getItem('gs_user_token');
  if (!token){
    location.href = `/directory.html?join=1&follow=${encodeURIComponent(S.space.tenant.id)}&back=${encodeURIComponent(location.pathname + location.search)}`;
    return;
  }
  try {
    const res = await fetch(`${API}/manage-follow`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token },
      body: JSON.stringify({ action: S.following ? 'unfollow' : 'follow', tenantId: S.space.tenant.id })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    S.following = !S.following;
    document.querySelectorAll('#followBtn,#followTop').forEach(b => {
      b.innerHTML = ic('heart') + (S.following ? ' Following' : ' Follow');
      b.classList.toggle('on', S.following);
    });
    toast(S.following ? data.message || "You'll hear from them first." : 'Unfollowed.');
  } catch(e){ toast(e.message); }
}

/* ---------- helpers ---------- */
function fmt(t){
  if (!t) return '';
  const [h,m] = String(t).split(':').map(Number);
  const ap = h >= 12 ? 'pm' : 'am';
  const hh = h % 12 || 12;
  return m ? `${hh}:${String(m).padStart(2,'0')}${ap}` : `${hh}${ap}`;
}
function when(iso){
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleString('en-US',{ weekday:'long', month:'long', day:'numeric', hour:'numeric', minute:'2-digit' });
}
function hexA(hex,a){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
/** Black or white text, whichever is actually readable on this brand colour. */
function readable(hex){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  const [r,g,b] = [(n>>16)&255,(n>>8)&255,n&255].map(v => {
    const s = v/255;
    return s <= .03928 ? s/12.92 : Math.pow((s+.055)/1.055, 2.4);
  });
  return (.2126*r + .7152*g + .0722*b) > .42 ? '#1c1917' : '#ffffff';
}

function revealOnScroll(){
  const els = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach((e,i) => {
      if (e.isIntersecting){
        setTimeout(() => e.target.classList.add('in'), i * 55);
        io.unobserve(e.target);
      }
    });
  }, { threshold:.12, rootMargin:'0px 0px -40px' });
  els.forEach(e => io.observe(e));
}
